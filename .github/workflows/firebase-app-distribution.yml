name: Flutter CI/CD & Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze project structure
        run: flutter analyze --no-pub

      - name: Run unit tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Save the validated APK for manual distribution
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  distribute:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      vars.FIREBASE_DISTRIBUTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    environment: firebase-app-distribution

    steps:
      - name: Verify the deployment event and exact branch
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main

      - name: Download the APK from this validation run
        uses: actions/download-artifact@v4
        with:
          name: firebase-release-apk
          path: firebase-release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          : "${FIREBASE_APP_ID:?FIREBASE_APP_ID is required}" "${FIREBASE_TOKEN:?FIREBASE_TOKEN is required}"
          firebase appdistribution:distribute firebase-release/app-release.apk \
            --non-interactive \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "testers" \
            --release-notes "Build triggered by GitHub Actions. Commit: $GITHUB_SHA"
